apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-backend
  namespace: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: familyclub-backend
    ports:
    - protocol: TCP
      port: 6379
