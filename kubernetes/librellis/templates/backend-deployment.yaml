apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-backend
    app.kubernetes.io/part-of: librellis
    app.kubernetes.io/component: backend
    app.kubernetes.io/environment: {{ .Release.Namespace }}
    app.kubernetes.io/tag: {{ .Values.backend.tag }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 6
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-backend
        app.kubernetes.io/version: "{{ .Values.backend.image.tag }}"
      annotations:
        image-digest: "{{ .Values.backend.image.digest }}"
        build-date: "{{ .Values.backend.image.buildDate }}"
        commit-hash: "{{ .Values.backend.image.commitHash }}"
        branch: "{{ .Values.backend.image.branch }}"
        repository: "{{ .Values.backend.image.repository }}"
        tag: "{{ .Values.backend.tag }}"
    spec:
      serviceAccountName: {{ .Release.Name }}-backend
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      imagePullSecrets:
        - name: dockerhub-secrets
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}@{{ .Values.backend.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            timeoutSeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            timeoutSeconds: 5
            periodSeconds: 5
          env:
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-key
            - name: ConnectionStrings__FamilyClub_DB
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: db-connection
            - name: Jwt__Issuer
              value: "AmazingFamilyesClubApp"
            - name: Jwt__Audience
              value: "AmazingFamilyClub"
            - name: AllowedOrigins__0
              value: "*"
            - name: Redis__Host
              value: "redis-0.{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local"
            - name: Redis__Port
              value: "6379"
            - name: Redis__Password
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: password
            - name: Redis__Database
              value: "0"
            - name: Authentication__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: oidc-google
                  key: ClientID
            - name: Authentication__Google__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: oidc-google
                  key: ClientSecret
            - name: AzureCommunicationServices__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: azure-communication-secrets
                  key: AzureCommunicationServices__ConnectionString
            - name: AzureCommunicationServices__FromEmail
              valueFrom:
                secretKeyRef:
                  name: azure-communication-secrets
                  key: AzureCommunicationServices__FromEmail
            - name: AzureCommunicationServices__FromName
              valueFrom:
                secretKeyRef:
                  name: azure-communication-secrets
                  key: AzureCommunicationServices__FromName

            - name: InkAssistant__OllamaBaseUrl
              value: "http://{{ .Release.Name }}-ollama:{{ .Values.ollama.env.port }}"
            - name: InkAssistant__Model
              value: "{{ .Values.ollama.model }}"
            - name: InkAssistant__EmbeddingModel
              value: "{{ .Values.ollama.embeddingModel }}"
              
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]