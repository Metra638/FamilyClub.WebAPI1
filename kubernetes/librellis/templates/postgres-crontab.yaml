apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-postgres-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres-backup
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: backup
    app.kubernetes.io/environment: {{ .Release.Namespace }}
  annotations:
    description: "Daily PostgreSQL backup"
    schedule-note: "Runs daily at 01:00 UTC"
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-postgres-backup-job
        app.kubernetes.io/part-of: familyclub
        app.kubernetes.io/component: backup-job
        app.kubernetes.io/environment: {{ .Release.Namespace }}
      annotations:
        description: "Job for PostgreSQL backup"
        created-by: "CronJob {{ .Release.Name }}-postgres-backup"
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}-postgres-backup-pod
            app.kubernetes.io/part-of: familyclub
            app.kubernetes.io/component: backup-pod
            app.kubernetes.io/environment: {{ .Release.Namespace }}
        spec:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
          securityContext:
            fsGroup: 999
          containers:
            - name: backup
              image: "{{ .Values.postgres.backup.image.repository }}:{{ .Values.postgres.backup.image.tag }}"
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  PGPASSWORD=$POSTGRES_PASSWORD pg_dump -U postgres -h {{ .Release.Name }}-postgres {{ .Values.postgres.database }} > /backup/backup-$(date +%Y%m%d-%H%M%S).sql
                  find /backup -name "*.sql" -mtime +{{ .Values.postgres.backup.retentionDays }} -delete
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.secretName }}
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-postgres-backup-pvc
          restartPolicy: OnFailure