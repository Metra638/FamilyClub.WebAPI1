apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/app: {{ .Release.Name }}-ollama
spec:
  replicas: {{ .Values.ollama.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/app: {{ .Release.Name }}-ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/app: {{ .Release.Name }}-ollama
    spec:
      initContainers:
        - name: pull-models
          image: "ollama/ollama@{{ .Values.ollama.image.digest }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ollama serve &
              PID=$!
              until ollama list >/dev/null 2>&1; do
                sleep 2
              done
              ollama pull {{ .Values.ollama.model }}
              ollama pull {{ .Values.ollama.embeddingModel }}
              kill $PID
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: "ollama/ollama@{{ .Values.ollama.image.digest }}"
          ports:
            - name: http
              containerPort: {{ .Values.ollama.env.port }}
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "{{ .Values.ollama.env.ip }}:{{ .Values.ollama.env.port }}"
          resources:
            requests:
              cpu: "2"
              memory: "3Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ollama