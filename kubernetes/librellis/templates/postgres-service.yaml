apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
  annotations:
    config.linkerd.io/opaque-ports: "{{ .Values.postgres.service.port }}"
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
  ports:
    - protocol: TCP
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
  type: ClusterIP
