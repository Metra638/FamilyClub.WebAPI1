apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-backend
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      appProtocol: http
  type: ClusterIP