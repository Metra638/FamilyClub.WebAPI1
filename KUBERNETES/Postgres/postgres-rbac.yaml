apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres         
  namespace: production
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: backend
  annotations:
    description: "ServiceAccount for postgres pods to access secrets"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-secret-reader
  namespace: production
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["postgres-secret"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-secret-access
  namespace: production
subjects:
- kind: ServiceAccount
  name: postgres
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-secret-reader