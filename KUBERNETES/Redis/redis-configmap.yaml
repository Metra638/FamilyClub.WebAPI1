apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: production
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    
    requirepass ${REDIS_PASSWORD}
    
    bind 0.0.0.0
    port 6379
    protected-mode no
    
    loglevel notice
    
    rename-command FLUSHALL ""
    rename-command FLUSHDB ""
