apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend        
  namespace: production
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: backend
  annotations:
    description: "ServiceAccount for backend pods to access secrets"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-secret-reader
  namespace: production
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["dockerhub-secret", "backend-secrets", "azure-communication-secret"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-secret-access
  namespace: production
subjects:
- kind: ServiceAccount
  name: backend
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-secret-reader
