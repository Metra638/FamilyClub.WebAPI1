---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: familyclub-backend
  namespace: production
  labels:
    app.kubernetes.io/name: familyclub-backend
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: backend
    app.kubernetes.io/environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 6
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: familyclub-backend
        app.kubernetes.io/version: "1.0"
      annotations:
        image-digest: ""
        build-date: "2026-09-02T17:54:00+01:00"
        commit-hash: "89530e10b1a05be3e0f984de98ab304a79e60833"
        branch: "Final"
        repository: "https://github.com/Metra638/FamilyClub.WebAPI1"
    spec:
      serviceAccountName: backend
      imagePullSecrets:
        - name: dockerhub-secret
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: metra638/test1@
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            timeoutSeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            timeoutSeconds: 5
            periodSeconds: 5
          env:
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-key
            - name: ConnectionStrings__FamilyClub_DB
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: db-connection
            - name: Jwt__Issuer
              value: "AmazingFamilyClubApp"
            - name: Jwt__Audience
              value: "AmazingFamilyClub"
            - name: AllowedOrigins__0
              value: "*"
            - name: Redis__Host
              value: "redis-0.production.svc.cluster.local"
            - name: Redis__Port
              value: "6379"
            - name: Redis__Password
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: Redis__Database
              value: "0"
              
            - name: Authentication__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: oidc-google
                  key: ClientID
            - name: Authentication__Google__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: oidc-google
                  key: ClientSecret
                  
            - name: AzureCommunicationServices__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: azure-communication-secret
                  key: AzureCommunicationServices__ConnectionString
            - name: AzureCommunicationServices__FromEmail
              valueFrom:
                secretKeyRef:
                  name: azure-communication-secret
                  key: AzureCommunicationServices__FromEmail
            - name: AzureCommunicationServices__FromName
              valueFrom:
                secretKeyRef:
                  name: azure-communication-secret
                  key: AzureCommunicationServices__FromName
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: production
  labels:
    app.kubernetes.io/name: familyclub-backend
spec:
  selector:
    app.kubernetes.io/name: familyclub-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      appProtocol: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: production
  labels:
    app.kubernetes.io/name: familyclub-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-backend
