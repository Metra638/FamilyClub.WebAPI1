---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: familyclub-frontend
  namespace: production
  labels:
    app.kubernetes.io/name: familyclub-frontend
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: frontend
    app.kubernetes.io/environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 6
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: familyclub-frontend
        app.kubernetes.io/version: "1.0"
      annotations:
        image-digest: "sha256:e05cfe3cefa7880c2ed282c8e1b837db81bc290074f7c1b6d8c31193458b232b"
        build-date: "2026-09-22T12:55:31+01:00"
        commit-hash: "b68ae2eeedce7de810e83c2e6a781b62c2a59b77"
        branch: "Final"
        repository: "https://github.com/Metra638/FamilyClub.WebAPI1"
    spec:
      serviceAccountName: frontend
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      imagePullSecrets:
      - name: dockerhub-secret
      terminationGracePeriodSeconds: 60
      containers:
      - name: frontend
        image: metra638/test1@sha256:e05cfe3cefa7880c2ed282c8e1b837db81bc290074f7c1b6d8c31193458b232b
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          timeoutSeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          timeoutSeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: production
  labels:
    app.kubernetes.io/name: familyclub-frontend
spec:
  selector:
    app.kubernetes.io/name: familyclub-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      appProtocol: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: production
  labels:
    app.kubernetes.io/name: familyclub-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-frontend
