update-backend-manifests:
  stage: update-backend-manifests
  script:
    - |
      set -e
      echo "=== DIAGNOSTIC START ==="
      echo "backendArm64Digest: $backendArm64Digest"
      echo "=== DIAGNOSTIC END ==="

      git config user.email "apofeoz638@gmail.com"
      git config user.name "Artem Malashevskyi"
      git checkout $CI_COMMIT_BRANCH || git checkout -b $CI_COMMIT_BRANCH
      if git ls-remote --heads origin $CI_COMMIT_BRANCH | grep -q $CI_COMMIT_BRANCH; then
        git pull --rebase --autostash origin $CI_COMMIT_BRANCH
      else
        echo "Remote branch does not exist, skipping pull"
      fi

      sed -i "s|image: metra638/test1@.*|image: metra638/test1@${backendArm64Digest}|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|image-digest: \"[^\"]*\"|image-digest: \"${backendArm64Digest}\"|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|build-date: \".*\"|build-date: \"$(date -Iseconds)\"|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|commit-hash: \".*\"|commit-hash: \"$CI_COMMIT_SHA\"|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|branch: \".*\"|branch: \"$CI_COMMIT_BRANCH\"|g" KUBERNETES/Backend/backend-deployment.yaml

      sed -i "s|image: metra638/test1@.*|image: metra638/test1@${backendArm64Digest}|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|image-digest: \"[^\"]*\"|image-digest: \"${backendArm64Digest}\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|build-date: \".*\"|build-date: \"$(date -Iseconds)\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|commit-hash: \".*\"|commit-hash: \"$CI_COMMIT_SHA\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|branch: \".*\"|branch: \"$CI_COMMIT_BRANCH\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml

      git add KUBERNETES/Backend/backend-deployment.yaml KUBERNETES-TEST/Backend/backend-deployment.yaml
      git commit -m "Update backend manifest with arm64 digest, build-date, commit, branch: $CI_COMMIT_BRANCH" || echo "No changes to commit"
      git remote set-url origin https://oauth2:${GITHUB_TOKEN}@github.com/Metra638/FamilyClub.WebAPI1.git
      git push origin HEAD:$CI_COMMIT_BRANCH
  needs:
    - job: push-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never
