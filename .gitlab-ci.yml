stages:
  - sync
  - gitleaks
  - hadolint
  - npm-audit
  - eslint-security
  - frontend-checks
  - build-frontend
  - scan-frontend
  - dast-frontend
  - push-frontend
  - backend-checks
  - test-backend
  - build-backend
  - scan-backend
  - dast-backend
  - push-backend
  - update-frontend-manifests
  - update-backend-manifests
  - convert-sarif-to-codequality
  - sync2

variables:
  UPSTREAM_URL: "https://github.com/Metra638/FamilyClub.WebAPI1.git"
  dockerId: "metra638"
  repoName: "test1"

sync-repo:
  stage: sync
  script:
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - rm -rf /tmp/repo
    - git clone --branch Final $UPSTREAM_URL /tmp/repo
    - cd /tmp/repo
    - git remote set-url origin http://root:${GITLAB_PUSH_TOKEN}@localhost/root/librellis1.git
    - git push origin Final --force
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

gitleaks:
  stage: gitleaks
  script:
    - gitleaks detect --verbose --redact --source $CI_PROJECT_DIR --report-format sarif --report-path gitleaks.sarif || true
  artifacts:
    paths:
      - gitleaks.sarif
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

hadolint:
  stage: hadolint
  script:
    - hadolint --format sarif - < dockerfile.frontend > hadolint-frontend.sarif || true
    - hadolint --format sarif - < dockerfile.backend > hadolint-backend.sarif || true
  artifacts:
    paths:
      - hadolint-frontend.sarif
      - hadolint-backend.sarif
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

npm-audit:
  stage: npm-audit
  script:
    - cd FamilyClub.React/famiy.club.react
    - npm audit --audit-level=high --json > ../../npm-audit.json || true
    - cd ../..
    - |
      if [ -f npm-audit.json ]; then
        jq -n --slurpfile audit npm-audit.json '{
          "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
          "version": "2.1.0",
          "runs": [{
            "tool": { "driver": { "name": "npm-audit", "informationUri": "https://docs.npmjs.com/cli/v10/commands/npm-audit" } },
            "results": ($audit[0].vulnerabilities // {} | to_entries | map({
              "ruleId": .key,
              "level": "error",
              "message": { "text": (.value.title // .key) },
              "locations": [{
                "physicalLocation": {
                  "artifactLocation": { "uri": "package.json" }
                }
              }]
            }))
          }]
        }' > npm-audit.sarif
      fi
  artifacts:
    paths:
      - npm-audit.sarif
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

eslint-security:
  stage: eslint-security
  script:
    - cd FamilyClub.React/famiy.club.react
    - npm install --save-dev eslint-plugin-security @microsoft/eslint-formatter-sarif || true
    - npx eslint --plugin security . --format @microsoft/eslint-formatter-sarif --output-file ../../eslint-security.sarif || true
  artifacts:
    paths:
      - eslint-security.sarif
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

frontend-checks:
  stage: frontend-checks
  script:
    - cd FamilyClub.React/famiy.club.react
    - npm ci || npm install
    - npm run lint || true
    - npx tsc --noEmit || true
    - npm run build || true
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

build-frontend:
  stage: build-frontend
  script:
    - |
      export BUILDKIT_NO_CLIENT_IPV6=1
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      docker buildx use default
      for ARCH in arm64 amd64; do
        echo "Сборка для $ARCH"
        docker buildx build \
          --platform linux/$ARCH \
          --no-cache \
          -f dockerfile.frontend \
          -o type=docker,dest=frontend-$ARCH.tar \
          --build-arg BUILD_DATE=$(date -Iseconds) \
          --build-arg VCS_REF=$CI_COMMIT_SHA \
          --build-arg VERSION=$CI_PIPELINE_ID \
          .
        LOAD_OUTPUT=$(docker load --quiet < frontend-$ARCH.tar)
        IMAGE_ID=$(echo $LOAD_OUTPUT | grep -o 'sha256:[a-f0-9]*')
        FULL_TAG="${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-$ARCH"
        docker tag $IMAGE_ID $FULL_TAG
        rm -f frontend-$ARCH.tar
      done
      DIGEST=$(docker inspect --format='{{.Id}}' "${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-arm64")
      echo "frontendArm64Digest=$DIGEST" > frontend.env
  artifacts:
    reports:
      dotenv: frontend.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

scan-frontend:
  stage: scan-frontend
  script:
    - |
      for ARCH in arm64 amd64; do
        trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output trivy-frontend-$ARCH.sarif "${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-$ARCH" || true
      done
  artifacts:
    paths:
      - trivy-frontend-arm64.sarif
      - trivy-frontend-amd64.sarif
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

dast-frontend:
  stage: dast-frontend
  script:
    - |
      set +e
      echo "Starting DAST scan for frontend"
      IMAGE="${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-amd64"

      if ! docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "$IMAGE"; then
        echo "ERROR: Image not found locally"
        echo "Frontend image not found locally" > zap_report_frontend.html
        echo '{"error": "Frontend image not found locally"}' > zap_report_frontend.json
        exit 0
      fi

      docker network create dast-frontend-net || true

      echo "Starting frontend with 'node node_modules/.bin/next start'"
      if ! docker run -d --name frontend-test --network dast-frontend-net --entrypoint node $IMAGE node_modules/.bin/next start; then
        echo "ERROR: Container failed to start"
        echo "Frontend startup failed" > zap_report_frontend.html
        echo '{"error": "Startup failed"}' > zap_report_frontend.json
        docker network rm dast-frontend-net || true
        exit 0
      fi

      echo "Waiting 40 seconds for frontend to start"
      sleep 40

      if ! docker ps | grep frontend-test; then
        echo "Container not running, logs:"
        docker logs frontend-test || true
        docker stop frontend-test && docker rm frontend-test || true
        docker network rm dast-frontend-net || true
        echo "Frontend container crashed" > zap_report_frontend.html
        echo '{"error": "Container crashed"}' > zap_report_frontend.json
        exit 0
      fi

      mkdir -p zap_reports_frontend
      chmod 777 zap_reports_frontend

      docker run --rm \
        --network dast-frontend-net \
        -v $(pwd)/zap_reports_frontend:/zap/wrk/:rw \
        zaproxy/zap-stable \
        zap-baseline.py \
        -t http://frontend-test:3000 \
        -r zap_report_frontend.html \
        -J zap_report_frontend.json \
        2>&1 | tee zap_frontend_output.log || true

      ZAP_EXIT_CODE=${PIPESTATUS[0]}
      echo "ZAP exit code: $ZAP_EXIT_CODE"

      if [ -f zap_reports_frontend/zap_report_frontend.html ]; then
        echo "Report generated"
        cp zap_reports_frontend/zap_report_frontend.html .
        cp zap_reports_frontend/zap_report_frontend.json .
      else
        echo "Report NOT generated, exit code: $ZAP_EXIT_CODE"
        echo "Last 30 lines of ZAP output:"
        tail -30 zap_frontend_output.log
        echo "ZAP scan failed with exit code $ZAP_EXIT_CODE" > zap_report_frontend.html
        echo '{"error": "ZAP scan failed"}' > zap_report_frontend.json
      fi

      docker stop frontend-test && docker rm frontend-test || true
      docker network rm dast-frontend-net || true
      exit 0
  artifacts:
    paths:
      - zap_report_frontend.html
      - zap_report_frontend.json
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

push-frontend:
  stage: push-frontend
  script:
    - |
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      for ARCH in arm64 amd64; do
        FULL_TAG="${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-$ARCH"
        docker push $FULL_TAG | tee push-frontend-$ARCH.log
      done
      docker manifest create ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID} \
        --amend ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-arm64 \
        --amend ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-amd64
      MANIFEST_PUSH_OUTPUT=$(docker manifest push ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID} 2>&1)
      echo "$MANIFEST_PUSH_OUTPUT"
      MANIFEST_DIGEST=$(echo "$MANIFEST_PUSH_OUTPUT" | grep -o 'sha256:[a-f0-9]\{64\}' | head -1)
      echo "Frontend multi-arch digest: $MANIFEST_DIGEST"
      echo "frontendArm64Digest=$MANIFEST_DIGEST" > frontend.env
  artifacts:
    reports:
      dotenv: frontend.env
  needs:
    - job: build-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

backend-checks:
  stage: backend-checks
  script:
    - echo "Auditing NuGet dependencies for vulnerabilities"
    - dotnet list package --vulnerable --include-transitive || true

    - echo "Checking code formatting"
    - dotnet format --verify-no-changes --verbosity minimal || true

    - echo "Restoring dependencies"
    - dotnet restore

    - echo "Building project with code analyzers enabled"
    - dotnet build --no-restore -c Release /p:RunAnalyzers=true /p:EnforceCodeStyleInBuild=true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

test-backend:
  stage: test-backend
  script:
    - dotnet test FamilyClub.WebAPI.Tests/FamilyClub.WebAPI.Tests.csproj
    - dotnet test FamilyClub.BLL.Tests/FamilyClub.BLL.Tests.csproj
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

build-backend:
  stage: build-backend
  script:
    - |
      export BUILDKIT_NO_CLIENT_IPV6=1
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      docker buildx use default
      for ARCH in arm64 amd64; do
        echo "Сборка для $ARCH"
        docker buildx build \
          --platform linux/$ARCH \
          --no-cache \
          -f dockerfile.backend \
          -o type=docker,dest=backend-$ARCH.tar \
          --build-arg BUILD_DATE=$(date -Iseconds) \
          --build-arg VCS_REF=$CI_COMMIT_SHA \
          --build-arg VERSION=$CI_PIPELINE_ID \
          .
        LOAD_OUTPUT=$(docker load --quiet < backend-$ARCH.tar)
        IMAGE_ID=$(echo $LOAD_OUTPUT | grep -o 'sha256:[a-f0-9]*')
        FULL_TAG="${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-$ARCH"
        docker tag $IMAGE_ID $FULL_TAG
        rm -f backend-$ARCH.tar
      done
      DIGEST=$(docker inspect --format='{{.Id}}' "${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-arm64")
      echo "BackendArm64Digest=$DIGEST" > backend.env
  artifacts:
    reports:
      dotenv: backend.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

scan-backend:
  stage: scan-backend
  script:
    - |
      for ARCH in arm64 amd64; do
        trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --format sarif --output trivy-backend-$ARCH.sarif "${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-$ARCH" || true
      done
  artifacts:
    paths:
      - trivy-backend-arm64.sarif
      - trivy-backend-amd64.sarif
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

dast-backend:
  stage: dast-backend
  script:
    - |
      set +e
      echo "Starting DAST scan for backend"
      IMAGE="${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-amd64"

      docker stop backend-test db-test 2>/dev/null || true
      docker rm -f backend-test db-test 2>/dev/null || true
      docker network rm dast-backend-net 2>/dev/null || true

      if ! docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "$IMAGE"; then
        echo "ERROR: Image not found locally"
        echo "Backend image not found locally" > zap_report_backend.html
        echo '{"error": "Backend image not found locally"}' > zap_report_backend.json
        echo '{"error": "Backend image not found locally"}' > openapi.json
        exit 0
      fi

      docker network create dast-backend-net || true

      echo "Starting test PostgreSQL container"
      docker run -d --name db-test --network dast-backend-net \
        -e POSTGRES_PASSWORD=MyStrongPass123! \
        -e POSTGRES_DB=familyclub_db \
        postgres:15

      echo "Waiting 30 seconds for PostgreSQL to start"
      sleep 30

      DB_CONN="Host=db-test;Database=familyclub_db;Username=postgres;Password=MyStrongPass123!"

      echo "Starting backend container with environment variables"
      if ! docker run -d --name backend-test --network dast-backend-net \
        -e ASPNETCORE_ENVIRONMENT=Development \
        -e Jwt__Key="${JWT_KEY}" \
        -e Jwt__Issuer="${JWT_ISSUER}" \
        -e Jwt__Audience="${JWT_AUDIENCE}" \
        -e ConnectionStrings__FamilyClub_DB="${DB_CONN}" \
        $IMAGE; then
        echo "ERROR: Container failed to start"
        echo "Backend startup failed" > zap_report_backend.html
        echo '{"error": "Startup failed"}' > zap_report_backend.json
        echo '{"error": "Startup failed"}' > openapi.json
        docker stop db-test && docker rm db-test || true
        docker network rm dast-backend-net || true
        exit 0
      fi

      echo "Waiting 40 seconds for backend to start"
      sleep 40

      if ! docker ps | grep backend-test; then
        echo "Container not running, logs:"
        docker logs backend-test || true
        docker stop backend-test && docker rm backend-test || true
        docker stop db-test && docker rm db-test || true
        docker network rm dast-backend-net || true
        echo "Backend container crashed" > zap_report_backend.html
        echo '{"error": "Container crashed"}' > zap_report_backend.json
        echo '{"error": "Container crashed"}' > openapi.json
        exit 0
      fi

      echo "Downloading OpenAPI specification"
      MAX_RETRIES=30
      RETRY_DELAY=10
      SUCCESS=0
      for i in $(seq 1 $MAX_RETRIES); do
        echo "Attempt $i/$MAX_RETRIES..."
        if docker exec backend-test wget -qO- http://localhost:8080/swagger/v1/swagger.json > openapi.json 2>/dev/null && [ -s openapi.json ] && head -c 1 openapi.json | grep -q "{"; then
          echo "OpenAPI spec downloaded on attempt $i:"
          ls -lh openapi.json
          head -c 200 openapi.json
          SUCCESS=1
          break
        fi
        echo "Not ready yet, waiting ${RETRY_DELAY}s"
        sleep $RETRY_DELAY
      done
      if [ "$SUCCESS" -eq 0 ]; then
        echo "ERROR: Failed to download openapi.json after $MAX_RETRIES attempts"
        echo '{"error": "Failed to download openapi.json"}' > openapi.json
      fi

      echo "Generating Redoc HTML documentation"
      docker run --rm \
        -v $(pwd):/spec \
        redocly/cli:1.34.5 build-docs /spec/openapi.json -o /spec/index.html || echo "Redoc generation failed, but continuing"

      mkdir -p zap_reports_backend
      chmod 777 zap_reports_backend

      docker run --rm \
        --network dast-backend-net \
        -v $(pwd)/zap_reports_backend:/zap/wrk/:rw \
        zaproxy/zap-stable \
        zap-baseline.py \
        -t http://backend-test:8080 \
        -r zap_report_backend.html \
        -J zap_report_backend.json \
        2>&1 | tee zap_backend_output.log || true

      ZAP_EXIT_CODE=${PIPESTATUS[0]}
      echo "ZAP exit code: $ZAP_EXIT_CODE"

      if [ -f zap_reports_backend/zap_report_backend.html ]; then
        echo "Report generated"
        cp zap_reports_backend/zap_report_backend.html .
        cp zap_reports_backend/zap_report_backend.json .
      else
        echo "Report NOT generated, exit code: $ZAP_EXIT_CODE"
        echo "Last 30 lines of ZAP output:"
        tail -30 zap_backend_output.log
        echo "ZAP scan failed with exit code $ZAP_EXIT_CODE" > zap_report_backend.html
        echo '{"error": "ZAP scan failed"}' > zap_report_backend.json
      fi

      docker stop backend-test && docker rm backend-test || true
      docker stop db-test && docker rm db-test || true
      docker network rm dast-backend-net || true
      exit 0
  artifacts:
    paths:
      - zap_report_backend.html
      - zap_report_backend.json
      - openapi.json
      - index.html
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

push-backend:
  stage: push-backend
  script:
    - |
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      for ARCH in arm64 amd64; do
        FULL_TAG="${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-$ARCH"
        docker push $FULL_TAG | tee push-backend-$ARCH.log
      done
      docker manifest create ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID} \
        --amend ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-arm64 \
        --amend ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-amd64
      MANIFEST_PUSH_OUTPUT=$(docker manifest push ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID} 2>&1)
      echo "$MANIFEST_PUSH_OUTPUT"
      MANIFEST_DIGEST=$(echo "$MANIFEST_PUSH_OUTPUT" | grep -o 'sha256:[a-f0-9]\{64\}' | head -1)
      echo "Backend multi-arch digest: $MANIFEST_DIGEST"
      echo "BackendArm64Digest=$MANIFEST_DIGEST" > backend.env
  artifacts:
    reports:
      dotenv: backend.env
  needs:
    - job: build-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

update-frontend-manifests:
  stage: update-frontend-manifests
  script:
    - |
      set -e
      if [ -f frontend.env ]; then
        export $(cat frontend.env | xargs)
      else
        echo "WARNING: frontend.env not found"
      fi

      git config user.email "apofeoz638@gmail.com"
      git config user.name "Artem Malashevskyi"
      git checkout $CI_COMMIT_BRANCH || git checkout -b $CI_COMMIT_BRANCH

      git remote set-url origin https://oauth2:${GITHUB_TOKEN}@github.com/Metra638/FamilyClub.WebAPI1.git

      git fetch origin $CI_COMMIT_BRANCH
      git reset --hard origin/$CI_COMMIT_BRANCH

      sed -i "s|image: metra638/test1@.*|image: metra638/test1@${frontendArm64Digest}|g" KUBERNETES/Frontend/frontend-deployment.yaml
      sed -i "s|image-digest: \"[^\"]*\"|image-digest: \"${frontendArm64Digest}\"|g" KUBERNETES/Frontend/frontend-deployment.yaml
      sed -i "s|build-date: \".*\"|build-date: \"$(date -Iseconds)\"|g" KUBERNETES/Frontend/frontend-deployment.yaml
      sed -i "s|commit-hash: \".*\"|commit-hash: \"$CI_COMMIT_SHA\"|g" KUBERNETES/Frontend/frontend-deployment.yaml
      sed -i "s|branch: \".*\"|branch: \"$CI_COMMIT_BRANCH\"|g" KUBERNETES/Frontend/frontend-deployment.yaml

      sed -i "s|image: metra638/test1@.*|image: metra638/test1@${frontendArm64Digest}|g" KUBERNETES-TEST/Frontend/frontend-deployment.yaml
      sed -i "s|image-digest: \"[^\"]*\"|image-digest: \"${frontendArm64Digest}\"|g" KUBERNETES-TEST/Frontend/frontend-deployment.yaml
      sed -i "s|build-date: \".*\"|build-date: \"$(date -Iseconds)\"|g" KUBERNETES-TEST/Frontend/frontend-deployment.yaml
      sed -i "s|commit-hash: \".*\"|commit-hash: \"$CI_COMMIT_SHA\"|g" KUBERNETES-TEST/Frontend/frontend-deployment.yaml
      sed -i "s|branch: \".*\"|branch: \"$CI_COMMIT_BRANCH\"|g" KUBERNETES-TEST/Frontend/frontend-deployment.yaml

      git add KUBERNETES/Frontend/frontend-deployment.yaml KUBERNETES-TEST/Frontend/frontend-deployment.yaml
      git commit -m "Update frontend manifest with arm64 digest, build-date, commit, branch: $CI_COMMIT_BRANCH" || echo "No changes to commit"
      git push --force-with-lease origin HEAD:$CI_COMMIT_BRANCH
  needs:
    - job: push-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

update-backend-manifests:
  stage: update-backend-manifests
  script:
    - |
      set -e
      if [ -f backend.env ]; then
        export $(cat backend.env | xargs)
      else
        echo "WARNING: backend.env not found"
      fi

      git config user.email "apofeoz638@gmail.com"
      git config user.name "Artem Malashevskyi"
      git checkout $CI_COMMIT_BRANCH || git checkout -b $CI_COMMIT_BRANCH

      git remote set-url origin https://oauth2:${GITHUB_TOKEN}@github.com/Metra638/FamilyClub.WebAPI1.git

      git fetch origin $CI_COMMIT_BRANCH
      git reset --hard origin/$CI_COMMIT_BRANCH

      sed -i "s|image: metra638/test1@.*|image: metra638/test1@${BackendArm64Digest}|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|image-digest: \"[^\"]*\"|image-digest: \"${BackendArm64Digest}\"|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|build-date: \".*\"|build-date: \"$(date -Iseconds)\"|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|commit-hash: \".*\"|commit-hash: \"$CI_COMMIT_SHA\"|g" KUBERNETES/Backend/backend-deployment.yaml
      sed -i "s|branch: \".*\"|branch: \"$CI_COMMIT_BRANCH\"|g" KUBERNETES/Backend/backend-deployment.yaml

      sed -i "s|image: metra638/test1@.*|image: metra638/test1@${BackendArm64Digest}|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|image-digest: \"[^\"]*\"|image-digest: \"${BackendArm64Digest}\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|build-date: \".*\"|build-date: \"$(date -Iseconds)\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|commit-hash: \".*\"|commit-hash: \"$CI_COMMIT_SHA\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml
      sed -i "s|branch: \".*\"|branch: \"$CI_COMMIT_BRANCH\"|g" KUBERNETES-TEST/Backend/backend-deployment.yaml

      git add KUBERNETES/Backend/backend-deployment.yaml KUBERNETES-TEST/Backend/backend-deployment.yaml
      git commit -m "Update backend manifest with arm64 digest, build-date, commit, branch: $CI_COMMIT_BRANCH" || echo "No changes to commit"
      git push --force-with-lease origin HEAD:$CI_COMMIT_BRANCH
  needs:
    - job: push-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

convert-sarif-to-codequality:
  stage: convert-sarif-to-codequality
  script:
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - |
      if ! command -v sarif-converter >/dev/null 2>&1; then
        dotnet tool install --global sarif-converter --version 2.* || true
      fi
      if command -v sarif-converter >/dev/null 2>&1; then
        echo "sarif-converter доступен: $(sarif-converter --version 2>&1 | head -1)"  
      fi

    - |
      SARIF_FILES=""
      for f in gitleaks.sarif hadolint-frontend.sarif hadolint-backend.sarif npm-audit.sarif eslint-security.sarif trivy-frontend-arm64.sarif trivy-frontend-amd64.sarif trivy-backend-arm64.sarif trivy-backend-amd64.sarif; do
        if [ -f "$f" ]; then
          echo "  Найден: $f"
          SARIF_FILES="$SARIF_FILES $f"
        fi
      done

      if [ -z "$SARIF_FILES" ]; then
        echo "SARIF-файлы не найдены. Создаём пустой отчёт."
        echo "[]" > gl-code-quality-report.json
        exit 0
      fi

      if command -v sarif-converter >/dev/null 2>&1; then
        sarif-converter --type codequality $SARIF_FILES gl-code-quality-report.json \
          || echo "[]" > gl-code-quality-report.json
      else
        echo "Используем jq-fallback..."
        jq -s '
          [
            .[]?.runs[]?.results[]?
            | {
                description: (.message.text // .message.markdown // "No description"),
                check_name: (.ruleId // "unknown"),
                fingerprint: (
                  ((.locations[0].physicalLocation.artifactLocation.uri // "unknown")
                   + ":"
                   + ((.locations[0].physicalLocation.region.startLine // 0) | tostring)
                   + ":"
                   + (.ruleId // "unknown"))
                ),
                severity: (
                  if .level == "error" then "major"
                  elif .level == "warning" then "minor"
                  else "info"
                  end
                ),
                location: {
                  path: (.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                  lines: { begin: (.locations[0].physicalLocation.region.startLine // 1) }
                }
              }
          ]
        ' $SARIF_FILES > gl-code-quality-report.json
      fi

    - |
      if [ -f gl-code-quality-report.json ]; then
        sed -i "s|file://$CI_PROJECT_DIR/||g; s|$CI_PROJECT_DIR/||g" gl-code-quality-report.json
        jq -r '.[0].location.path' gl-code-quality-report.json || true
      fi
    
    - |
      if [ -f gl-code-quality-report.json ]; then
        ls -lh gl-code-quality-report.json
        echo "Количество проблем: $(jq 'length' gl-code-quality-report.json 2>/dev/null || echo '?')"
        head -c 1000 gl-code-quality-report.json
      else
        echo "ERROR: gl-code-quality-report.json не создан"
        echo "[]" > gl-code-quality-report.json
      fi
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week
    when: always
  needs:
    - job: gitleaks
      artifacts: true
      optional: true
    - job: hadolint
      artifacts: true
      optional: true
    - job: npm-audit
      artifacts: true
      optional: true
    - job: eslint-security
      artifacts: true
      optional: true
    - job: scan-frontend
      artifacts: true
      optional: true
    - job: scan-backend
      artifacts: true
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

sync-repo2:
  stage: sync2
  script:
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - rm -rf /tmp/repo
    - git clone --branch Final $UPSTREAM_URL /tmp/repo
    - cd /tmp/repo
    - git remote set-url origin http://root:${GITLAB_PUSH_TOKEN}@localhost/root/librellis1.git
    - git push origin Final --force
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never