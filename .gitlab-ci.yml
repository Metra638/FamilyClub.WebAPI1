# ────────────────────────────────────────────────────────────────
# CONVERTER (SARIF + codemetrics → codequality)
# ────────────────────────────────────────────────────────────────
convert-sarif-to-codequality:
  stage: convert-sarif-to-codequality
  script:
    - |
      SARIF_FILES=""
      for f in gitleaks.sarif hadolint-frontend.sarif hadolint-backend.sarif \
               npm-audit.sarif eslint-security.sarif \
               trivy-frontend.sarif trivy-backend.sarif \
               osv-frontend.sarif osv-backend.sarif jscpd.sarif; do
        if [ -f "$f" ]; then
          echo "  Found: $f"
          SARIF_FILES="$SARIF_FILES $f"
        fi
      done
      if [ -z "$SARIF_FILES" ]; then
        echo "[]" > gl-code-quality-report-sarif.json
      else
        jq -s '
          def map_sev:
            if ((.ruleId // "") | test("^(CVE-|GHSA-)"; "i")) then "critical"
            elif ((.ruleId // "") | test("(secret|api.?key|password|token|credential)"; "i")) then "critical"
            elif (((.properties // {})["security-severity"])? // null) != null then
              (((.properties // {})["security-severity"]) | tostring | tonumber? // 0) as $s |
              if $s >= 9 then "critical"
              elif $s >= 7 then "major"
              elif $s >= 4 then "minor"
              else "info" end
            elif .level == "error" then "major"
            elif .level == "warning" then "minor"
            else "info" end
          ;
          [
            .[]? | .runs[]? | .results[]?
            | {
                description: (.message.text // .message.markdown // "No description"),
                check_name: (.ruleId // "unknown"),
                fingerprint: (
                  ((.locations[0].physicalLocation.artifactLocation.uri // "unknown")
                   + ":" + ((.locations[0].physicalLocation.region.startLine // 0) | tostring)
                   + ":" + (.ruleId // "unknown"))
                ),
                severity: map_sev,
                location: {
                  path: (.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                  lines: { begin: (.locations[0].physicalLocation.region.startLine // 1) }
                }
              }
          ]
        ' $SARIF_FILES > gl-code-quality-report-sarif.json || echo "[]" > gl-code-quality-report-sarif.json
      fi

    - |
      if [ -f code-metrics-backend.json ]; then
        jq '
          [ .findings[]? | select(.suppressed != true) | {
              description: .message,
              check_name: .ruleId,
              fingerprint: ((.location.file // "unknown") + ":" + ((.location.line // 0) | tostring) + ":" + .ruleId),
              severity: (
                if .severity == "critical" then "critical"
                elif .severity == "high" then "major"
                elif .severity == "moderate" then "minor"
                elif .severity == "low" then "info"
                else "info" end
              ),
              location: { path: .location.file, lines: { begin: (.location.line // 1) } }
            }
          ]
        ' code-metrics-backend.json > gl-code-quality-report-codemetrics.json \
          || echo "[]" > gl-code-quality-report-codemetrics.json
      else
        echo "[]" > gl-code-quality-report-codemetrics.json
      fi

    - jq -s 'add' gl-code-quality-report-sarif.json gl-code-quality-report-codemetrics.json > gl-code-quality-report.json

    - |
      sed -i "s|file://$CI_PROJECT_DIR/||g; s|$CI_PROJECT_DIR/||g" gl-code-quality-report.json || true
      ls -lh gl-code-quality-report.json
      echo "Всего проблем: $(jq 'length' gl-code-quality-report.json 2>/dev/null || echo '?')"
      jq -r 'group_by(.severity) | map("\(.[0].severity): \(length)")[]' gl-code-quality-report.json 2>/dev/null || true
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week
    when: always
  needs:
    - { job: gitleaks,               artifacts: true, optional: true }
    - { job: hadolint,               artifacts: true, optional: true }
    - { job: npm-audit,              artifacts: true, optional: true }
    - { job: eslint-security,        artifacts: true, optional: true }
    - { job: scan-frontend,          artifacts: true, optional: true }
    - { job: scan-backend,           artifacts: true, optional: true }
    - { job: osv-scanner-frontend,   artifacts: true, optional: true }
    - { job: osv-scanner-backend,    artifacts: true, optional: true }
    - { job: jscpd,                  artifacts: true, optional: true }
    - { job: code-metrics-backend,   artifacts: true, optional: true }
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

