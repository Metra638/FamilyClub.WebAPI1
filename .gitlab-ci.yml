stages:
  - sync
  - gitleaks
  - hadolint
  - npm-audit
  - eslint-security
  - backend-checks
  - test-backend
  - build-backend
  - scan-backend
  - sbom-backend
  - dast-backend
  - push-backend
  - frontend-checks
  - build-frontend
  - scan-frontend
  - sbom-frontend
  - dast-frontend
  - push-frontend
  - update-frontend-manifests
  - update-backend-manifests
  - convert-sarif-to-codequality
  - sync2

variables:
  UPSTREAM_URL: "https://github.com/Metra638/FamilyClub.WebAPI1.git"
  dockerId: "metra638"
  repoName: "test1"

# ────────────────────────────────────────────────────────────────
# SYNC
# ────────────────────────────────────────────────────────────────
sync-repo:
  stage: sync
  script:
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - rm -rf /tmp/repo
    - git clone --branch Final $UPSTREAM_URL /tmp/repo
    - cd /tmp/repo
    - git remote set-url origin http://root:${GITLAB_PUSH_TOKEN}@localhost/root/librellis1.git
    - git push origin Final --force
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# ────────────────────────────────────────────────────────────────
# SECRETS / LINT / AUDIT
# ────────────────────────────────────────────────────────────────
gitleaks:
  stage: gitleaks
  script:
    - gitleaks detect --verbose --redact --no-git --source "$CI_PROJECT_DIR" --report-format sarif --report-path gitleaks.sarif || true
  artifacts:
    paths:
      - gitleaks.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

hadolint:
  stage: hadolint
  script:
    - hadolint --format sarif dockerfile.frontend > hadolint-frontend.sarif || true
    - hadolint --format sarif dockerfile.backend  > hadolint-backend.sarif  || true
  artifacts:
    paths:
      - hadolint-frontend.sarif
      - hadolint-backend.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

npm-audit:
  stage: npm-audit
  script:
    - cd FamilyClub.React/famiy.club.react
    - npm audit --audit-level=high --json > ../../npm-audit.json || true
    - cd ../..
    - |
      if [ -f npm-audit.json ]; then
        jq -n --slurpfile audit npm-audit.json '{
          "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
          "version": "2.1.0",
          "runs": [{
            "tool": { "driver": { "name": "npm-audit", "informationUri": "https://docs.npmjs.com/cli/v10/commands/npm-audit" } },
            "results": ($audit[0].vulnerabilities // {} | to_entries | map({
              "ruleId": ("NPM-AUDIT-" + (.value.severity | ascii_upcase)),
              "level": (
                if .value.severity == "critical" or .value.severity == "high" then "error"
                elif .value.severity == "moderate" then "warning"
                else "note" end
              ),
              "message": { "text": (
                .key + ": " + (
                  if (.value.via | type) == "array"
                  then ([.value.via[] | if type == "object" then .title else . end] | join("; "))
                  else (.value.via | tostring) end
                ) + "  [severity=" + .value.severity + ", range=" + (.value.range // "?") + "]"
              )},
              "locations": [{
                "physicalLocation": {
                  "artifactLocation": { "uri": "FamilyClub.React/famiy.club.react/package.json" },
                  "region": { "startLine": 1 }
                }
              }],
              "properties": { "security-severity": (
                if .value.severity == "critical" then "9.5"
                elif .value.severity == "high" then "8.0"
                elif .value.severity == "moderate" then "5.0"
                else "2.0" end
              )}
            }))
          }]
        }' > npm-audit.sarif
      else
        echo '{"version":"2.1.0","runs":[]}' > npm-audit.sarif
      fi
  artifacts:
    paths:
      - npm-audit.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

eslint-security:
  stage: eslint-security
  script:
    - cd FamilyClub.React/famiy.club.react
    - npm install --save-dev eslint-plugin-security @microsoft/eslint-formatter-sarif --no-audit --no-fund || true
    - |
      npx eslint . \
        --plugin security \
        --rule 'security/detect-object-injection: warn' \
        --rule 'security/detect-non-literal-regexp: warn' \
        --rule 'security/detect-unsafe-regex: warn' \
        --rule 'security/detect-non-literal-fs-filename: warn' \
        --rule 'security/detect-eval-with-expression: warn' \
        --rule 'security/detect-child-process: warn' \
        --rule 'security/detect-pseudoRandomBytes: warn' \
        --rule 'security/detect-buffer-noassert: warn' \
        --rule 'security/detect-disable-mustache-escape: warn' \
        --rule 'security/detect-new-buffer: warn' \
        --ignore-pattern 'node_modules/**' \
        --ignore-pattern '.next/**' \
        --ignore-pattern 'vendor/**' \
        --ignore-pattern 'lib/api/generated/**' \
        --ignore-pattern 'public/**' \
        --format @microsoft/eslint-formatter-sarif \
        --output-file ../../eslint-security.sarif || true
  artifacts:
    paths:
      - eslint-security.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# ────────────────────────────────────────────────────────────────
# BACKEND CHECKS
# ────────────────────────────────────────────────────────────────
backend-checks:
  stage: backend-checks
  script:
    - echo "NuGet vulnerable → nuget-vulnerable.log"
    - dotnet list package --vulnerable --include-transitive > nuget-vulnerable.log 2>&1 || true
    - echo "Formatting → format-check.log"
    - dotnet format --verify-no-changes --verbosity minimal > format-check.log 2>&1 || true
    - dotnet restore
    - dotnet build --no-restore -c Release /p:RunAnalyzers=true /p:EnforceCodeStyleInBuild=true
  artifacts:
    when: always
    paths:
      - nuget-vulnerable.log
      - format-check.log
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# FIX: block scalar + -w /src (иначе сканировался / в контейнере)
osv-scanner-backend:
  stage: backend-checks
  script:
    - |
      docker run --rm \
        -v "$PWD:/src" \
        -w /src \
        ghcr.io/google/osv-scanner:latest \
        scan source -r \
          --format sarif \
          --output-file /src/osv-backend.sarif \
          . \
          --x-exclude /src/FamilyClub.React/ || true
  artifacts:
    paths:
      - osv-backend.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

code-metrics-backend:
  stage: backend-checks
  script:
    - dotnet tool install --global Dependably.CodeMetrics || true
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - codemetrics . --format json > code-metrics-backend.json || true
    - test -f code-metrics-backend.json || echo '{"findings":[]}' > code-metrics-backend.json
  artifacts:
    paths:
      - code-metrics-backend.json
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

archmap-analysis:
  stage: backend-checks
  script:
    - echo "Запуск ArchMAP"
    - python3 -m venv .venv-archmap
    - .venv-archmap/bin/pip install KG-ARCHMAP
    - .venv-archmap/bin/archmap analyze .
    # Исправлено на .codeatlas
    - cp .codeatlas/graph.json archmap-report.json || true
  artifacts:
    paths:
      - archmap-report.json
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# ────────────────────────────────────────────────────────────────
# BACKEND TEST / BUILD / SCAN / SBOM / DAST / PUSH
# ────────────────────────────────────────────────────────────────
test-backend:
  stage: test-backend
  script:
    - |
      dotnet test FamilyClub.WebAPI.Tests/FamilyClub.WebAPI.Tests.csproj \
        --logger "trx;LogFileName=webapi.trx" || true
      dotnet test FamilyClub.BLL.Tests/FamilyClub.BLL.Tests.csproj \
        --logger "trx;LogFileName=bll.trx" || true
  artifacts:
    when: always
    paths:
      - "**/*.trx"
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

build-backend:
  stage: build-backend
  script:
    - |
      export BUILDKIT_NO_CLIENT_IPV6=1
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      docker buildx use default
      for ARCH in arm64 amd64; do
        echo "Сборка для $ARCH"
        docker buildx build \
          --platform linux/$ARCH \
          --no-cache \
          -f dockerfile.backend \
          -o type=docker,dest=backend-$ARCH.tar \
          --build-arg BUILD_DATE=$(date -Iseconds) \
          --build-arg VCS_REF=$CI_COMMIT_SHA \
          --build-arg VERSION=$CI_PIPELINE_ID \
          .
        LOAD_OUTPUT=$(docker load --quiet < backend-$ARCH.tar)
        IMAGE_ID=$(echo $LOAD_OUTPUT | grep -o 'sha256:[a-f0-9]*')
        FULL_TAG="${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-$ARCH"
        docker tag $IMAGE_ID $FULL_TAG
        rm -f backend-$ARCH.tar
      done
      DIGEST=$(docker inspect --format='{{.Id}}' "${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-arm64")
      echo "BackendArm64Digest=$DIGEST" > backend.env
  artifacts:
    reports:
      dotenv: backend.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

scan-backend:
  stage: scan-backend
  script:
    - |
      trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress \
        --format sarif --output trivy-backend.sarif \
        "${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-amd64" || true
  artifacts:
    paths:
      - trivy-backend.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

sbom-backend:
  stage: sbom-backend
  image: anchore/syft:latest
  script:
    - |
      IMAGE="${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-amd64"
      syft "$IMAGE" -o spdx-json=sbom-backend.spdx.json
      syft "$IMAGE" -o cyclonedx-json=sbom-backend.cdx.json
      ls -lh sbom-backend.*
  artifacts:
    paths:
      - sbom-backend.spdx.json
      - sbom-backend.cdx.json
    when: always
    expire_in: 1 week
  needs:
    - job: build-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

dast-backend:
  stage: dast-backend
  script:
    - |
      set +e
      IMAGE="${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-amd64"
      docker rm -f backend-test db-test 2>/dev/null || true
      docker network rm dast-backend-net 2>/dev/null || true
      if ! docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "$IMAGE"; then
        echo '{"error":"image not found"}' > zap_report_backend.json
        echo '{"error":"image not found"}' > openapi.json
        exit 0
      fi
      docker network create dast-backend-net || true
      docker run -d --name db-test --network dast-backend-net \
        -e POSTGRES_PASSWORD=MyStrongPass123! -e POSTGRES_DB=familyclub_db postgres:15
      sleep 30
      DB="Host=db-test;Database=familyclub_db;Username=postgres;Password=MyStrongPass123!"
      docker run -d --name backend-test --network dast-backend-net \
        -e ASPNETCORE_ENVIRONMENT=Development \
        -e Jwt__Key="${JWT_KEY}" -e Jwt__Issuer="${JWT_ISSUER}" -e Jwt__Audience="${JWT_AUDIENCE}" \
        -e ConnectionStrings__FamilyClub_DB="${DB}" $IMAGE || {
          echo '{"error":"start failed"}' > zap_report_backend.json
          exit 0
        }
      sleep 40
      docker ps | grep backend-test || {
        docker logs backend-test
        docker rm -f backend-test db-test
        exit 0
      }
      for i in $(seq 1 30); do
        docker exec backend-test wget -qO- http://localhost:8080/swagger/v1/swagger.json > openapi.json 2>/dev/null && \
          [ -s openapi.json ] && head -c1 openapi.json | grep -q "{" && break
        sleep 10
      done
      docker run --rm -v $(pwd):/spec redocly/cli:1.34.5 build-docs /spec/openapi.json -o /spec/index.html || true
      mkdir -p zap_reports_backend && chmod 777 zap_reports_backend
      docker run --rm --network dast-backend-net \
        -v $(pwd)/zap_reports_backend:/zap/wrk/:rw zaproxy/zap-stable \
        zap-baseline.py -t http://backend-test:8080 \
        -r zap_report_backend.html -J zap_report_backend.json \
        2>&1 | tee zap_backend_output.log || true
      if [ -f zap_reports_backend/zap_report_backend.html ]; then
        cp zap_reports_backend/zap_report_backend.html .
        cp zap_reports_backend/zap_report_backend.json .
      else
        echo '{"error":"scan failed"}' > zap_report_backend.json
      fi
      docker rm -f backend-test db-test || true
      docker network rm dast-backend-net || true
      exit 0
  artifacts:
    paths:
      - zap_report_backend.html
      - zap_report_backend.json
      - openapi.json
      - index.html
    when: always
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

push-backend:
  stage: push-backend
  script:
    - |
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      for ARCH in arm64 amd64; do
        docker push "${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-$ARCH" | tee push-backend-$ARCH.log
      done
      docker manifest create ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID} \
        --amend ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-arm64 \
        --amend ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID}-amd64
      OUT=$(docker manifest push ${dockerId}/${repoName}:backend-${CI_PIPELINE_ID} 2>&1)
      echo "$OUT"
      DIGEST=$(echo "$OUT" | grep -o 'sha256:[a-f0-9]\{64\}' | head -1)
      echo "BackendArm64Digest=$DIGEST" > backend.env
      TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_PASSWORD}\"}" \
        | jq -r '.token')
      if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
        for SUFFIX in arm64 amd64; do
          curl -s -o /dev/null -w "delete backend-${CI_PIPELINE_ID}-$SUFFIX: %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${dockerId}/${repoName}/tags/backend-${CI_PIPELINE_ID}-${SUFFIX}/"
        done
      fi
  artifacts:
    reports:
      dotenv: backend.env
  needs:
    - job: build-backend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# ────────────────────────────────────────────────────────────────
# FRONTEND CHECKS
# ────────────────────────────────────────────────────────────────
frontend-checks:
  stage: frontend-checks
  script:
    - cd FamilyClub.React/famiy.club.react
    - npm ci || npm install
    - npm run lint   > ../../frontend-lint.log 2>&1 || true
    - npx tsc --noEmit > ../../frontend-tsc.log 2>&1 || true
    - npm run build || true
  artifacts:
    when: always
    paths:
      - frontend-lint.log
      - frontend-tsc.log
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# FIX: block scalar — иначе `\` уходит в shell как аргумент
osv-scanner-frontend:
  stage: frontend-checks
  script:
    - |
      docker run --rm \
        -v "$PWD:/src" \
        -w /src/FamilyClub.React/famiy.club.react \
        ghcr.io/google/osv-scanner:latest \
        scan source -r \
          --format sarif \
          --output-file /src/osv-frontend.sarif \
          . || true
  artifacts:
    paths:
      - osv-frontend.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# FIX: block scalar + правильное имя файла (jscpd-report.sarif, не sarif.json)
jscpd:
  stage: frontend-checks
  script:
    - |
      npx jscpd@latest \
        --reporters sarif \
        --output ./jscpd-report \
        --format "javascript,typescript,tsx,jsx,css,scss,markup,csharp" \
        --ignore "**/node_modules/**,**/*.min.js,**/vendor/**,**/lib/api/generated/**" \
        . || true
    - mv ./jscpd-report/jscpd-report.sarif ./jscpd.sarif || true
    - test -f jscpd.sarif || echo '{"version":"2.1.0","runs":[]}' > jscpd.sarif
  artifacts:
    paths:
      - jscpd.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

# ────────────────────────────────────────────────────────────────
# FRONTEND BUILD / SCAN / SBOM / DAST / PUSH
# ────────────────────────────────────────────────────────────────
build-frontend:
  stage: build-frontend
  script:
    - |
      export BUILDKIT_NO_CLIENT_IPV6=1
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      docker buildx use default
      for ARCH in arm64 amd64; do
        echo "Сборка для $ARCH"
        docker buildx build \
          --platform linux/$ARCH \
          --no-cache \
          -f dockerfile.frontend \
          -o type=docker,dest=frontend-$ARCH.tar \
          --build-arg BUILD_DATE=$(date -Iseconds) \
          --build-arg VCS_REF=$CI_COMMIT_SHA \
          --build-arg VERSION=$CI_PIPELINE_ID \
          .
        LOAD_OUTPUT=$(docker load --quiet < frontend-$ARCH.tar)
        IMAGE_ID=$(echo $LOAD_OUTPUT | grep -o 'sha256:[a-f0-9]*')
        FULL_TAG="${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-$ARCH"
        docker tag $IMAGE_ID $FULL_TAG
        rm -f frontend-$ARCH.tar
      done
      DIGEST=$(docker inspect --format='{{.Id}}' "${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-arm64")
      echo "frontendArm64Digest=$DIGEST" > frontend.env
  artifacts:
    reports:
      dotenv: frontend.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

scan-frontend:
  stage: scan-frontend
  script:
    - |
      trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress \
        --format sarif --output trivy-frontend.sarif \
        "${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-amd64" || true
  artifacts:
    paths:
      - trivy-frontend.sarif
    when: always
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

sbom-frontend:
  stage: sbom-frontend
  image: anchore/syft:latest
  script:
    - |
      echo "Генерация SBOM для frontend образа"
      IMAGE="${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-amd64"
      syft "$IMAGE" -o spdx-json=sbom-frontend.spdx.json
      syft "$IMAGE" -o cyclonedx-json=sbom-frontend.cdx.json
      ls -lh sbom-frontend.*
  artifacts:
    paths:
      - sbom-frontend.spdx.json
      - sbom-frontend.cdx.json
    when: always
    expire_in: 1 week
  needs:
    - job: build-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

dast-frontend:
  stage: dast-frontend
  script:
    - |
      set +e
      IMAGE="${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-amd64"
      if ! docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "$IMAGE"; then
        echo "Frontend image not found locally" > zap_report_frontend.html
        echo '{"error":"image not found"}' > zap_report_frontend.json
        exit 0
      fi
      docker network create dast-frontend-net || true
      docker run -d --name frontend-test --network dast-frontend-net \
        --entrypoint node $IMAGE node_modules/.bin/next start || {
          echo '{"error":"start failed"}' > zap_report_frontend.json
          exit 0
        }
      sleep 40
      docker ps | grep frontend-test || {
        docker logs frontend-test
        docker rm -f frontend-test
        exit 0
      }
      mkdir -p zap_reports_frontend && chmod 777 zap_reports_frontend
      docker run --rm --network dast-frontend-net \
        -v $(pwd)/zap_reports_frontend:/zap/wrk/:rw zaproxy/zap-stable \
        zap-baseline.py -t http://frontend-test:3000 \
        -r zap_report_frontend.html -J zap_report_frontend.json \
        2>&1 | tee zap_frontend_output.log || true
      if [ -f zap_reports_frontend/zap_report_frontend.html ]; then
        cp zap_reports_frontend/zap_report_frontend.html .
        cp zap_reports_frontend/zap_report_frontend.json .
      else
        echo '{"error":"scan failed"}' > zap_report_frontend.json
      fi
      docker rm -f frontend-test || true
      docker network rm dast-frontend-net || true
      exit 0
  artifacts:
    paths:
      - zap_report_frontend.html
      - zap_report_frontend.json
    when: always
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: build-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

push-frontend:
  stage: push-frontend
  script:
    - |
      echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      for ARCH in arm64 amd64; do
        docker push "${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-$ARCH" | tee push-frontend-$ARCH.log
      done
      docker manifest create ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID} \
        --amend ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-arm64 \
        --amend ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID}-amd64
      OUT=$(docker manifest push ${dockerId}/${repoName}:frontend-${CI_PIPELINE_ID} 2>&1)
      echo "$OUT"
      DIGEST=$(echo "$OUT" | grep -o 'sha256:[a-f0-9]\{64\}' | head -1)
      echo "frontendArm64Digest=$DIGEST" > frontend.env
      TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_PASSWORD}\"}" \
        | jq -r '.token')
      if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
        for SUFFIX in arm64 amd64; do
          curl -s -o /dev/null -w "delete frontend-${CI_PIPELINE_ID}-$SUFFIX: %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${dockerId}/${repoName}/tags/frontend-${CI_PIPELINE_ID}-${SUFFIX}/"
        done
      fi
  artifacts:
    reports:
      dotenv: frontend.env
  needs:
    - job: build-frontend
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

