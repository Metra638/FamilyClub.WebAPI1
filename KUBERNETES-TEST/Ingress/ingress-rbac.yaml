apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-tls-reader
  namespace: test
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-tls-access
  namespace: test
subjects:
- kind: ServiceAccount
  name: ingress-nginx-test
  namespace: ingress-nginx-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-tls-reader
