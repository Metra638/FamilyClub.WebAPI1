---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: familyclub-frontend
  namespace: test
  labels:
    app.kubernetes.io/name: familyclub-frontend
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: frontend
    app.kubernetes.io/environment: test
spec:
  replicas: 1
  revisionHistoryLimit: 6
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: familyclub-frontend
        app.kubernetes.io/version: "1.0"
      annotations:
        image-digest: "sha256:99b6fe7c95bb01cbb62169aa702a9b94ad4d498c82672c12f1d746a09896806a"
        build-date: "2026-08-27T20:36:30+00:00"
        commit-hash: "cdb15c4cee33ff901b88c41fb4b61cc152f75e60"
        branch: "Final"
        repository: "https://github.com/Metra638/FamilyClub.WebAPI1"
    spec:
      serviceAccountName: frontend
      imagePullSecrets:
      - name: dockerhub-secret
      terminationGracePeriodSeconds: 60
      containers:
      - name: frontend
        image: metra638/test1@sha256:99b6fe7c95bb01cbb62169aa702a9b94ad4d498c82672c12f1d746a09896806a
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          protocol: TCP
        # Ресурсы (requests/limits) не указаны намеренно:
        # - Кластер имеет жёсткие ограничения по CPU/памяти, это приводит к "Pending".
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          timeoutSeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          timeoutSeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: test
  labels:
    app.kubernetes.io/name: familyclub-frontend
spec:
  selector:
    app.kubernetes.io/name: familyclub-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      appProtocol: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: test
  labels:
    app.kubernetes.io/name: familyclub-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-frontend
