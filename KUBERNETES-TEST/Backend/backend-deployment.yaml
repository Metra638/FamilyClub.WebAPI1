---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: familyclub-backend
  namespace: test
  labels:
    app.kubernetes.io/name: familyclub-backend
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: backend
    app.kubernetes.io/environment: test
spec:
  replicas: 1
  revisionHistoryLimit: 6
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: familyclub-backend
        app.kubernetes.io/version: "1.0"
      annotations:
        image-digest: "sha256:a8430bba1535ca08e069e1a1329cee0ee63ae19aa154a59234a1e0600c16a1fe"
        build-date: "2026-08-27T21:35:46+00:00"
        commit-hash: "07c8bd1adba14ce5ab61ea0753bdcb68ca051ce8"
        branch: "Final"
        repository: "https://github.com/Metra638/FamilyClub.WebAPI1"
    spec:
      serviceAccountName: backend
      imagePullSecrets:
      - name: dockerhub-secret
      terminationGracePeriodSeconds: 60
      containers:
      - name: backend
        image: metra638/test1@sha256:a8430bba1535ca08e069e1a1329cee0ee63ae19aa154a59234a1e0600c16a1fe
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        # Ресурсы (requests/limits) не указаны намеренно:
        # - Кластер имеет жёсткие ограничения по CPU/памяти, это приводит к "Pending".
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          timeoutSeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          timeoutSeconds: 5
          periodSeconds: 5
        env:
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: jwt-key
        - name: ConnectionStrings__FamilyClub_DB
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: db-connection
        - name: Jwt__Issuer
          value: "AmazingFamilyClubApp"
        - name: Jwt__Audience
          value: "AmazingFamilyClub"
        - name: AllowedOrigins__0
          value: "*"
        - name: Redis__Host
          value: "redis-0.production.svc.cluster.local"
        - name: Redis__Port
          value: "6379"
        - name: Redis__Password
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        - name: Redis__Database
          value: "0"
        - name: REDIS_HOST
          value: "redis-0.production.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: test
  labels:
    app.kubernetes.io/name: familyclub-backend
spec:
  selector:
    app.kubernetes.io/name: familyclub-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      appProtocol: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: test
  labels:
    app.kubernetes.io/name: familyclub-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: familyclub-backend
