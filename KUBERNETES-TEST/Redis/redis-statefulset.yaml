apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: test
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/app: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
          - containerPort: 6379
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: password
        command:
          - redis-server
        args:
          - --requirepass $(REDIS_PASSWORD)
          - --maxmemory 256mb
          - --maxmemory-policy allkeys-lru
          - --appendonly yes
          - --appendfsync everysec
          - --bind 0.0.0.0
          - --protected-mode no
        volumeMounts:
          - name: redis-data
            mountPath: /data
          - name: redis-tmp
            mountPath: /tmp
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - "redis-cli -a $REDIS_PASSWORD ping"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - "redis-cli -a $REDIS_PASSWORD ping"
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: redis-tmp
          emptyDir: {}
